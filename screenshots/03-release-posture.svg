<tspan x="94" dy="0">Release Posture</tspan>
</text>
    <text x="94" y="188" fill="#b8c6db" font-size="18" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="94" dy="0">Packet readiness, blocker pressure, and the next release checkpoint stay readable for</tspan>
<tspan x="94" dy="22">operators and buyers.</tspan>
</text>
    
    
