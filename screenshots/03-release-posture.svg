<tspan x="86" dy="37">cleanly</tspan>
</text>
    <text x="86" y="626" fill="#b8c6db" font-size="16" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="86" dy="0">Hosted preview planned gives the</tspan>
<tspan x="86" dy="20">public lane. Paid templates can</tspan>
<tspan x="86" dy="20">adapt packet families and QC</tspan>
<tspan x="86" dy="20">owners. Embedded delivery fits</tspan>
<tspan x="86" dy="20">regulated lab teams that need</tspan>
<tspan x="86" dy="20">evidence routing and release</tspan>
<tspan x="86" dy="20">posture inside their real assay</tspan>
