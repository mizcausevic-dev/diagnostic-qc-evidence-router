<tspan x="526" dy="37">packet</tspan>
</text>
    <text x="526" y="338" fill="#b8c6db" font-size="16" font-weight="400" font-family="Inter,Segoe UI,Arial">
<tspan x="526" dy="0">74 percent complete. Freshness is</tspan>
<tspan x="526" dy="20">recoverable if calibration and</tspan>
<tspan x="526" dy="20">replay close inside the next</tspan>
